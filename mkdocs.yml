site_name: Hapanels
site_description: Natywny panel Home Assistant dla Shelly Wall Display i tabletów z Androidem.
site_url: https://tw-zs.github.io/Hapanels/
repo_url: https://github.com/tw-zs/Hapanels
repo_name: tw-zs/Hapanels
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  language: pl
  logo: assets/hapanels_icon_no_text.svg
  favicon: assets/hapanels_icon_no_text.svg
  font: false
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Tryb jasny
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Tryb ciemny
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tw-zs/Hapanels

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      languages:
        - locale: pl
          name: Polski
          link: /Hapanels/
          default: true
          build: true
        - locale: en
          name: English
          link: /Hapanels/en/
          site_description: Native Home Assistant panel app for Shelly Wall Display and Android tablets.
          build: true
          theme:
            palette:
              - scheme: slate
                primary: deep orange
                accent: amber
                toggle:
                  icon: material/weather-sunny
                  name: Light mode
              - scheme: default
                primary: deep orange
                accent: amber
                toggle:
                  icon: material/weather-night
                  name: Dark mode
          nav:
            - Home: index.md
            - Installation:
                - Installation Options: installation.md
                - Shelly Guide: installation-shelly.md
                - Tablet Guide: installation-tablet.md
            - Home Assistant Integration: home-assistant-integration.md
            - Panel Hardware: hardware.md
            - Development: development.md
            - Attributions & Licenses: attribution.md
            - Roadmap: ROADMAP.md
            - Production Plan: PRODUCTION_PLAN.md

nav:
  - Strona główna: index.md
  - Instalacja:
      - Opcje instalacji: installation.md
      - Instrukcja dla Shelly: installation-shelly.md
      - Instrukcja dla tabletów: installation-tablet.md
  - Integracja Home Assistant: home-assistant-integration.md
  - Sprzęt panelu: hardware.md
  - Development: development.md
  - Podziękowania i Licencje: attribution.md
  - Roadmap: ROADMAP.md
  - Plan produkcyjny: PRODUCTION_PLAN.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
